# =============================================================================
#  CI (session 114): the build on the PRIMARY target, Windows / MSVC / Qt 5.15,
#  which had not been built since the library split (patch 88), plus the full
#  gate on Linux, where the Linux-only paths live (pty parity refusal, -lutil,
#  the low-latency ioctl).
#
#  Windows: library, app, unit suite and menu audit, the tests run offscreen.
#  Linux:   ./verify.sh, the same gate as on a developer's machine.
#  Linux, Qt 6 (session 127): the same gate on Qt 6.4, Ubuntu 24.04's. The
#           code is meant to build on both and had drifted, unbuilt, from 6.
# =============================================================================
name: build

on:
  push:
    branches: [ main ]
    tags: [ 'patch-*' ]
  pull_request:
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4

      - name: Qt 5.15 (MSVC 2019, 64-bit)
        uses: jurplel/install-qt-action@v4
        with:
          version: '5.15.2'
          host: windows
          target: desktop
          arch: win64_msvc2019_64
          cache: true

      - name: MSVC environment
        uses: ilammy/msvc-dev-cmd@v1

      - name: Configure
        shell: cmd
        run: |
          mkdir build
          cd build
          qmake ..\DLConsole.pro CONFIG+=with_tests CONFIG+=release > qmake.log 2>&1
          type qmake.log
          findstr /C:"building without the serial terminal" qmake.log && (echo Qt Serial Port is missing: the serial code would not be built or tested & exit /b 1) || exit /b 0

      - name: Build
        shell: cmd
        run: |
          cd build
          nmake

      # The native platform, not offscreen: Qt's offscreen plugin on Windows
      # draws no text (no font database), so the suites that count inked
      # pixels of drawn labels saw 0 (session 116). The runner has a desktop.
      - name: Unit suite
        shell: pwsh
        run: |
          $exe = Get-ChildItem -Recurse build -Filter dltests.exe | Select-Object -First 1
          if (-not $exe) { throw "dltests.exe was not built" }
          Push-Location tests
          $env:QT_QPA_PLATFORM = "windows"
          & $exe.FullName | Tee-Object -FilePath ..\dltests.log
          $rc = $LASTEXITCODE
          Pop-Location
          if ($rc -ne 0) { throw "dltests: $rc failed check(s)" }

      - name: Menu audit
        shell: pwsh
        run: |
          $exe = Get-ChildItem -Recurse build -Filter menuaudit.exe | Select-Object -First 1
          if (-not $exe) { throw "menuaudit.exe was not built" }
          Push-Location tests
          $env:QT_QPA_PLATFORM = "windows"
          & $exe.FullName
          $rc = $LASTEXITCODE
          Pop-Location
          # As hex too: a crash shows as an NTSTATUS (0xC0000005 = access violation).
          Write-Host ("menuaudit exit code: {0} (0x{1:X8})" -f $rc, $rc)
          if ($rc -ne 0) { throw "menuaudit failed" }

      - name: The program is where the docs say
        shell: pwsh
        run: |
          if (-not (Test-Path build\DLConsole.exe)) {
            Get-ChildItem -Recurse build -Filter DLConsole.exe | ForEach-Object { $_.FullName }
            throw "DLConsole.exe is not at <build>\DLConsole.exe (app.pro DESTDIR)"
          }

  linux:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Qt 5 and tools
        run: |
          sudo apt-get update
          sudo apt-get install -y qtbase5-dev qtbase5-dev-tools qt5-qmake libqt5serialport5-dev python3

      - name: The gate
        run: ./verify.sh

      - name: Logs
        if: always()
        run: |
          tail -40 build-verify/dltests.log || true
          grep '^FAIL' build-verify/menuaudit.log || true

  linux-qt6:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Qt 6 and tools
        run: |
          sudo apt-get update
          sudo apt-get install -y qt6-base-dev qt6-base-dev-tools libqt6serialport6-dev libgl1-mesa-dev python3

      - name: The gate
        run: QMAKE=qmake6 ./verify.sh

      - name: Logs
        if: always()
        run: |
          tail -40 build-verify/dltests.log || true
          grep '^FAIL' build-verify/menuaudit.log || true

  # ===========================================================================
  #  Session 269: single-file packages for people who only get the program.
  #  On each patch tag (and on a manual run, to try them): DLConsole.exe for
  #  Windows 10/11 and DLConsole-x86_64.AppImage for Linux, each started
  #  once here, then attached to a GitHub Release named after the tag, only
  #  when the gate jobs above passed too.
  # ===========================================================================
  package-windows:
    if: startsWith(github.ref, 'refs/tags/patch-') || github.event_name == 'workflow_dispatch'
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4

      - name: Qt 5.15 (MSVC 2019, 64-bit)
        uses: jurplel/install-qt-action@v4
        with:
          version: '5.15.2'
          host: windows
          target: desktop
          arch: win64_msvc2019_64
          cache: true

      - name: MSVC environment
        uses: ilammy/msvc-dev-cmd@v1

      - name: Build (release, the program only)
        shell: cmd
        run: |
          mkdir build
          cd build
          qmake ..\DLConsole.pro CONFIG+=release
          nmake

      - name: Single .exe
        shell: pwsh
        run: packaging\windows\make_single_exe.ps1 -Exe build\DLConsole.exe -Out dist\DLConsole.exe

      # Started as an operator would: it must unpack, run DLConsole, and
      # remove its temporary folder once DLConsole closes.
      - name: The single .exe starts
        shell: pwsh
        run: |
          $p = Start-Process -FilePath dist\DLConsole.exe -PassThru
          Start-Sleep -Seconds 20
          if ($p.HasExited) { throw "the package exited at once ($($p.ExitCode))" }
          $app = Get-CimInstance Win32_Process -Filter "ParentProcessId=$($p.Id)" |
                 Where-Object Name -eq 'DLConsole.exe'
          if (-not $app) { throw "DLConsole did not start from the package" }
          Write-Host "DLConsole running from $($app.ExecutablePath)"
          $dir = Split-Path -Parent $app.ExecutablePath
          Stop-Process -Id $app.ProcessId
          if (-not $p.WaitForExit(30000)) { throw "the package did not finish after DLConsole closed" }
          Start-Sleep -Seconds 2
          if (Test-Path $dir) { throw "the temporary folder was left behind: $dir" }

      # The BIU firmware's loco simulator (docs/biu-firmware/HOW_IT_WORKS.md),
      # a console program next to DLConsole.exe in the release.
      - name: Loco simulator (loco_sim.exe)
        shell: cmd
        run: |
          if not exist dist mkdir dist
          if not exist build\loco_sim mkdir build\loco_sim
          cl /nologo /std:c11 /W3 /O2 /D_CRT_SECURE_NO_WARNINGS /Idocs\biu-firmware\loco_sim /Fobuild\loco_sim\ docs\biu-firmware\loco_sim\loco_sim.c docs\biu-firmware\brake_pressure_interface_user.c /Fe:dist\loco_sim.exe ws2_32.lib
          dist\loco_sim.exe --help

      - uses: actions/upload-artifact@v4
        with:
          name: DLConsole-windows
          path: |
            dist/DLConsole.exe
            dist/loco_sim.exe

  # Built on AlmaLinux 8 (a RHEL 8 rebuild, glibc 2.28) so the AppImage runs
  # on RHEL 8 and everything newer; built on a newer system, it would not.
  # GCC 13 from gcc-toolset (links what RHEL 8's own libstdc++ lacks
  # statically), Qt 5.15 from RHEL 8's AppStream.
  package-linux:
    if: startsWith(github.ref, 'refs/tags/patch-') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Build and AppImage on AlmaLinux 8 (RHEL 8)
        run: |
          docker run --rm -v "$PWD:/src" -w /src almalinux:8 bash -euc '
            dnf install -y -q dnf-plugins-core
            dnf config-manager --set-enabled powertools
            dnf install -y -q gcc-toolset-13-gcc-c++ make qt5-qtbase-devel qt5-qtserialport-devel \
                which file findutils
            source /opt/rh/gcc-toolset-13/enable
            mkdir -p build-el8 && cd build-el8
            qmake-qt5 ../DLConsole.pro CONFIG+=release
            make -j"$(nproc)" >build.log 2>&1 || { tail -40 build.log; exit 1; }
            cd ..
            QMAKE=/usr/bin/qmake-qt5 WORK=/tmp/package packaging/linux/make_appimage.sh \
                build-el8/DLConsole dist/DLConsole-x86_64.AppImage'

      # On fresh systems with NO Qt: RHEL 8 and 9 (AlmaLinux) and Ubuntu.
      - name: The AppImage starts on RHEL 8, RHEL 9 and Ubuntu, without Qt
        run: |
          failed=0
          for img in almalinux:8 almalinux:9 ubuntu:24.04; do
            echo "== $img"
            docker run --rm -v "$PWD/dist:/dist" -v "$PWD/packaging/linux:/p" "$img" \
              sh /p/try_appimage.sh /dist/DLConsole-x86_64.AppImage || failed=1
          done
          exit $failed

      - uses: actions/upload-artifact@v4
        with:
          name: DLConsole-linux
          path: dist/DLConsole-x86_64.AppImage

  release:
    if: startsWith(github.ref, 'refs/tags/patch-')
    needs: [ windows, linux, linux-qt6, package-windows, package-linux ]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          n="${TAG#patch-}"
          gh release create "$TAG" dist/DLConsole.exe dist/DLConsole-x86_64.AppImage dist/loco_sim.exe \
            --repo "$GITHUB_REPOSITORY" --title "DLConsole $TAG" --notes "Single-file DLConsole, nothing to install.

          - **Windows 10/11:** \`DLConsole.exe\`. Start it. It unpacks to a temporary folder, runs, and cleans up when closed. Windows may warn about an unrecognised app the first time: More info, then Run anyway.
          - **Linux (RHEL 8 / 9 and newer, Ubuntu 20.04 and newer, other distributions with glibc 2.28 or newer):** \`DLConsole-x86_64.AppImage\`. \`chmod +x\` it, then start it. If it says FUSE is missing: \`./DLConsole-x86_64.AppImage --appimage-extract-and-run\`.

          - **Loco simulator (Windows):** \`loco_sim.exe\`, a console program that plays the VCC against the Brake Test Bench and the analog card. Run it from a Command Prompt: \`loco_sim.exe --bench 127.0.0.1\` (\`--help\` for the options). How it works: [docs/biu-firmware/HOW_IT_WORKS.md](https://github.com/$GITHUB_REPOSITORY/blob/$TAG/docs/biu-firmware/HOW_IT_WORKS.md).

          Files read from beside the program (color_rules.json, friendly_names.csv, fieldmap.json, testcases.json) go beside the downloaded file.

          What changed: [CHANGELOG, session $n](https://github.com/$GITHUB_REPOSITORY/blob/$TAG/CHANGELOG.md#session-$n)."
